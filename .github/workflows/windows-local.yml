name: Windows local workspace
on:
  pull_request:
    branches: [main, 'feature/windows-native-authorization', 'feature/windows-customer-credit']
    paths: ['apps/desktop/**', 'packages/business-domain/**', 'packages/local-store/**', '.github/workflows/windows-local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          workspaces: |
            packages/local-store
            apps/desktop/src-tauri
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Build bundled frontend
        run: npm run build --prefix apps/desktop
      - name: Test encrypted storage, Windows vault and restart behavior
        run: cargo test --all-targets --release --locked --manifest-path packages/local-store/Cargo.toml --target-dir apps/desktop/src-tauri/target
      - name: Build independent Windows installer
        run: npm run desktop:build --prefix apps/desktop
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install native accessibility review tooling
        run: python -m pip install pywinauto==0.6.9 Pillow==12.0.0
      - name: Verify native offline access, checkout guards and receipt recovery
        shell: pwsh
        run: |
          $prefix = 'Sornio-local-review-' + [guid]::NewGuid().ToString()
          $app = (Resolve-Path 'apps/desktop/src-tauri/target/release/sornio-desktop.exe').Path
          $runtimes = @(Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue)
          if ($runtimes.Count -eq 0) { throw 'Could not locate WebView2 to enforce the offline test.' }
          $programs = @($app) + @($runtimes | ForEach-Object { $_.FullName })
          $code = 1
          try {
            for ($index = 0; $index -lt $programs.Count; $index++) {
              New-NetFirewallRule -Name "$prefix-$index" -DisplayName "$prefix-$index" -Direction Outbound -Program $programs[$index] -Action Block | Out-Null
            }
            python apps/desktop/check-native.py
            $code = $LASTEXITCODE
          } finally {
            Get-NetFirewallRule -Name "$prefix-*" -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          }
          if ($code -ne 0) { exit $code }
      - name: Upload engineering installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sornio-Local-Workspace-Review
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload actual native screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sornio-Local-Native-Captures
          path: dist/native-review/
          if-no-files-found: ignore
          retention-days: 7

