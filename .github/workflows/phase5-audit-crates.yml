name: Phase 5 Audit Crate Fetch

on:
  push:
    branches: [arena/e831eb29-sornio]
    paths: ['.github/workflows/phase5-audit-crates.yml']

jobs:
  fetch-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e831eb29-sornio
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch all locked crates
        run: |
          cargo fetch --locked --manifest-path packages/local-store/Cargo.toml
      - name: Pack and push via git
        run: |
          set -x
          tar cf crates.tar -C ~/.cargo/registry/cache/ crates/*/
          ls -la crates.tar
          # Configure git
          git config user.email "actions@github.com"
          git config user.name "Phase5 Audit"
          # Add remote with token
          git remote add origin https://x-access-token:${GITHUB_TOKEN}@github.com/uddieee33-blip/Sornio.git
          # Create temp branch
          git checkout -b phase5-audit-crates-tmp
          mkdir -p phase5-audit-crates
          cp crates.tar phase5-audit-crates/
          git add phase5-audit-crates/crates.tar
          git commit -m "chore(phase5-audit): fetch locked crates"
          git push -u origin phase5-audit-crates-tmp:phase5-audit-crates-tmp
          echo "PUSH_DONE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
