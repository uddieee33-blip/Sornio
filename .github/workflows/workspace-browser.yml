name: Workspace browser review
on:
  pull_request:
    branches: [main, 'integration/windows-finance-recovery', 'hardening/financial-recovery-audit-2026-10-31', 'test/windows-evidence-verification-2026-11-01', 'feature/windows-native-authorization', 'feature/windows-customer-credit']
    paths: ['app/**', 'components/**', 'apps/desktop/**', 'packages/business-domain/**', 'packages/local-store/**', 'scripts/verify-workspace-browser.cjs', '.github/workflows/workspace-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_TEST_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # Isolated CI-only identity, never used by a hosted deployment.
      DUKAANOS_SESSION_SECRET: sornio-local-browser-review-only-2026
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: packages/local-store
      - name: Check native Rust formatting
        # On failure, apply rustfmt and emit the resulting diff as ::error::
        # annotations so the exact required formatting is visible in the check
        # record even when raw logs expire. The step still fails.
        shell: bash
        run: |
          if cargo fmt --manifest-path packages/local-store/Cargo.toml -- --check \
            && cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check; then
            exit 0
          fi
          cargo fmt --manifest-path packages/local-store/Cargo.toml
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml
          # One annotation carries the whole diff; newlines escaped as %0A so
          # the check-run API returns it in full instead of truncating a
          # per-line annotation list.
          git diff -- packages apps \
            | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' \
            | tr -d '\n' | sed 's/^/::error::rustfmt diff: /'
          git checkout -- packages apps
          exit 1
      - name: Test native billing and inventory in debug and release
        # Emit failing tests / compiler errors as full-text ::error::
        # annotations (newlines as %0A) so failures stay visible in the check
        # record even when raw logs expire. Both runs still fail normally.
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'; }
          run_tests() {
            local profile="$1"; shift
            local log; log="$(mktemp)"
            cargo test --all-targets --locked --manifest-path packages/local-store/Cargo.toml "$@" 2>&1 | tee "$log" || true
            local code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.clean"
              { grep -E '^test .* FAILED$|^test result: FAILED' "$log.clean" | head -60 | esc; } \
                | sed "s/^/::error::[$profile] failing tests: /"
              { grep -E '^error(\[|:)' "$log.clean" | head -30 | esc; } \
                | sed "s/^/::error::[$profile] compiler errors: /"
              { awk '/^failures:$/{f=1} f' "$log.clean" | grep -vE '^test .* ok$' | head -120 | esc; } \
                | sed "s/^/::error::[$profile] failure details: /"
            fi
            return "$code"
          }
          run_tests debug || exit $?
          run_tests release --release || exit $?
      - name: Build native cashier integration fixture
        run: cargo build --locked --manifest-path packages/local-store/Cargo.toml --example cashier_review_bridge
      - name: Verify synthetic native scale and damaged-return recovery
        run: python3 apps/desktop/check-native-scale.py --bridge packages/local-store/target/debug/examples/cashier_review_bridge --output /tmp/sornio-screenshots/native-scale.json
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/sornio-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/sornio-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run browser acceptance
        # On failure, emit the runner output tail as a ::error:: annotation so
        # the exact failing assertion is visible even when raw logs expire.
        # The step still fails with the script's own exit code.
        shell: bash
        run: |
          set -o pipefail
          npm run start > /tmp/sornio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          log=/tmp/sornio-browser-acceptance.log
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node scripts/verify-workspace-browser.cjs 2>&1 | tee "$log" || true
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            { tail -40 "$log"; echo '--- server log tail ---'; tail -20 /tmp/sornio-server.log; } \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
              | sed 's/^/::error::browser acceptance failure: /'
          fi
          exit "$code"
      - name: Build and review local desktop access UI
        # Same failure-annotation treatment as the browser acceptance step.
        shell: bash
        run: |
          set -o pipefail
          npm ci --prefix apps/desktop
          npm run build --prefix apps/desktop
          npm run dev --prefix apps/desktop > /tmp/sornio-desktop-server.log 2>&1 &
          desktop_pid=$!
          trap 'kill "$desktop_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1420 > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules"
          log=/tmp/sornio-desktop-checks.log
          : > "$log"
          run_check() {
            local name="$1"; shift
            node "apps/desktop/$name.cjs" "$@" 2>&1 | tee -a "$log" || true
            local code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              tail -40 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n' \
                | sed "s/^/::error::desktop UI check $name failed: /"
              exit "$code"
            fi
          }
          run_check check-ui
          run_check check-focus
          run_check check-inventory-refresh
          run_check check-checkout http://127.0.0.1:1420 "" /tmp/sornio-screenshots/checkout
          run_check check-receipts http://127.0.0.1:1420 "" /tmp/sornio-screenshots/receipts
          run_check check-authorization
          run_check check-backup
          run_check check-credentials
          run_check check-customers
          run_check check-statement-print http://127.0.0.1:1420 "" /tmp/sornio-screenshots/customer-statements
          run_check check-retail
          run_check check-inventory-recovery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: Sornio-workspace-review
          path: |
            /tmp/sornio-screenshots/
            /tmp/sornio-server.log
            /tmp/sornio-desktop-server.log
          retention-days: 7



