name: Phase 5 Audit Crate Fetch

on:
  push:
    branches: [arena/e831eb29-sornio]
    paths: ['.github/workflows/phase5-audit-crates.yml']

jobs:
  fetch-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch all locked crates
        run: |
          cargo fetch --locked --manifest-path packages/local-store/Cargo.toml
          echo "CARGO_FETCH_OK" > fetch-status.txt
          ls ~/.cargo/registry/cache/*/ | head -5 >> fetch-status.txt
          ls ~/.cargo/registry/cache/*/ | wc -l >> fetch-status.txt
      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: phase5-audit-fetch-status
          path: fetch-status.txt
          retention-days: 1
