[package]
name = "sornio-local-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 0.42 because of what it compiles, not its API surface. The advisory is in the
# SQLite C source, so the version that matters is the amalgamation, and only the
# 0.41+ series takes it from the `sqlcipher-src` crate:
#
#   rusqlite 0.37 -> libsqlite3-sys 0.35.0, vendored amalgamation, SQLite 3.46.1
#   rusqlite 0.40 -> libsqlite3-sys 0.38.2, vendored amalgamation, SQLite 3.51.3
#   rusqlite 0.41 -> sqlcipher-src 419.0.6,               SQLite 3.53.4
#   rusqlite 0.42 -> sqlcipher-src 420.0.0,               SQLite 3.54.1
#
# 3.54.0 is the fixed line for RUSTSEC-2026-0459 / CVE-2026-119375, so 0.42 is the
# oldest release whose SQLCipher build actually clears it. The first attempt at
# this was 0.40, chosen from the feature name alone; the version gate in
# native-lockfile.yml then compiled it and reported SQLite 3.51.3, which is why
# the floor is set here rather than where the changelog's wording suggested.
#
# Encryption is untouched: still SQLCipher, still 4.x, still the same on-disk
# format, with the migration and backup suites asserting that on real files.
rusqlite = { version = "0.42", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = { version = "0.5.3", features = ["zeroize"] }
getrandom = "0.3"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
zeroize = "1"
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
proptest = "1.12.0"


[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
zeroize = "1"
keyring = { version = "3", features = ["apple-native"] }
