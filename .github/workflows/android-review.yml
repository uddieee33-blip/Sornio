name: Android review package
on:
  pull_request:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify navigation boundary
        run: |
          javac -d /tmp/sornio-tests mobile/android/app/src/main/java/com/sornio/app/NavigationPolicy.java mobile/android/tests/NavigationPolicyTest.java
          java -cp /tmp/sornio-tests NavigationPolicyTest
      - name: Compile and lint Android app
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Sornio-Android-review
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
