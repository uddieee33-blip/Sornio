name: Replication PostgreSQL
on:
  pull_request:
    branches: [main, 'integration/windows-finance-recovery', 'hardening/financial-recovery-audit-2026-10-31']
    paths:
      - 'packages/replication-cloud/**'
      - 'packages/local-store/**'
      - 'scripts/verify-replication-postgres.mjs'
      - 'scripts/verify-replication-native-https.mjs'
      - 'scripts/verify-replication.mjs'
      - '.github/workflows/replication-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    name: Real PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sornio
          POSTGRES_PASSWORD: sornio-replication-ci
          POSTGRES_DB: sornio_replication
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sornio -d sornio_replication"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sornio:sornio-replication-ci@localhost:5432/sornio_replication
      CI: true
      CARGO_TERM_COLOR: always
      SORNIO_NATIVE_OUTBOX_DIR: /tmp/sornio-native-outbox
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          workspaces: packages/local-store
      - name: Install dependencies
        run: npm ci
      - name: Real PostgreSQL ingest races
        run: node scripts/verify-replication-postgres.mjs
      - name: Export native SQLCipher outbox envelopes
        run: |
          mkdir -p "$SORNIO_NATIVE_OUTBOX_DIR"
          cargo test --locked --manifest-path packages/local-store/Cargo.toml native_sqlcipher_export_pipeline -- --ignored --exact --nocapture
      - name: Native SQLCipher envelopes over TLS into PostgreSQL
        run: |
          ls -la "$SORNIO_NATIVE_OUTBOX_DIR"
          node scripts/verify-replication-native-https.mjs
      - name: Annotate native HTTPS failure
        if: failure()
        run: |
          if [ -f "$SORNIO_NATIVE_OUTBOX_DIR/https-error.txt" ]; then
            echo "::error::$(head -n 1 "$SORNIO_NATIVE_OUTBOX_DIR/https-error.txt" | tr '\n' ' ')"
            cat "$SORNIO_NATIVE_OUTBOX_DIR/https-error.txt"
          fi
      - name: Apply HTTPS acks to the native sidecar
        run: cargo test --locked --manifest-path packages/local-store/Cargo.toml native_sqlcipher_apply_https_acks -- --ignored --exact --nocapture
