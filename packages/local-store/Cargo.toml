[package]
name = "sornio-local-store"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# 0.40 rather than 0.37 because of what it compiles, not its API surface.
# `bundled-sqlcipher-vendored-openssl` builds the SQLCipher amalgamation from
# `libsqlite3-sys/sqlcipher/sqlite3.c`. At libsqlite3-sys 0.35.0 (rusqlite 0.37)
# that file is SQLite 3.46.1, which is affected by RUSTSEC-2026-0459 /
# CVE-2026-119375 (uninitialized page-cache disclosure from a crafted WAL,
# fixed in SQLite 3.54.0) and carries no patched release. rusqlite 0.39 bumps
# the bundled SQLCipher to 4.14.0, whose amalgamation is SQLite 3.51.3: still
# below 3.54.0. rusqlite 0.40 moves the amalgamation into the `sqlcipher-src`
# crate and pins `=420.0.0`, which is SQLite 3.54.1 - above the fixed line - so
# it is the oldest rusqlite whose SQLCipher build actually clears the advisory.
# The encryption format is unchanged: SQLCipher 4.x reads 4.x databases, and the
# suite's migration and backup tests exercise that on real files.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
argon2 = { version = "0.5.3", features = ["zeroize"] }
getrandom = "0.3"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
fs2 = "0.4"
zeroize = "1"
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
proptest = "1.12.0"


[target.'cfg(target_os = "macos")'.dependencies]
fs2 = "0.4"
zeroize = "1"
keyring = { version = "3", features = ["apple-native"] }
