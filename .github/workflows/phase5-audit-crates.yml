name: Phase 5 Audit Crate Fetch

on:
  push:
    branches: [arena/e831eb29-sornio]
    paths: ['.github/workflows/phase5-audit-crates.yml']

jobs:
  fetch-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e831eb29-sornio
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch all locked crates
        run: |
          cargo fetch --locked --manifest-path packages/local-store/Cargo.toml
      - name: Pack and push
        run: |
          set -ex
          CRATE_FILES=$(find ~/.cargo/registry/cache -name "*.crate" 2>/dev/null)
          tar cf crates.tar $CRATE_FILES
          
          git config user.email "actions@github.com"
          git config user.name "Phase5 Audit"
          git checkout -b phase5-audit-crates-tmp
          mkdir -p phase5-audit-crates
          cp crates.tar phase5-audit-crates/
          git add phase5-audit-crates/crates.tar
          git commit -m "chore(phase5-audit): fetch locked crates"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/uddieee33-blip/Sornio.git HEAD:phase5-audit-crates-tmp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
