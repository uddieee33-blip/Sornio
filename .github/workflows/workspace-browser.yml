name: Workspace browser review
on:
  pull_request:
    branches: [main, 'feature/windows-native-authorization', 'feature/windows-customer-credit']
    paths: ['app/**', 'components/**', 'apps/desktop/**', 'packages/business-domain/**', 'packages/local-store/**', 'scripts/verify-workspace-browser.cjs', '.github/workflows/workspace-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      # Isolated CI-only identity, never used by a hosted deployment.
      DUKAANOS_SESSION_SECRET: sornio-local-browser-review-only-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/local-store
      - name: Check native Rust formatting
        run: |
          cargo fmt --manifest-path packages/local-store/Cargo.toml -- --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Test native billing and inventory in debug and release
        run: |
          cargo test --locked --manifest-path packages/local-store/Cargo.toml
          cargo test --release --locked --manifest-path packages/local-store/Cargo.toml
      - name: Build native cashier integration fixture
        run: cargo build --locked --manifest-path packages/local-store/Cargo.toml --example cashier_review_bridge
      - run: npm ci
      - run: npm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/sornio-browser" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/sornio-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Run browser acceptance
        run: |
          npm run start > /tmp/sornio-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node scripts/verify-workspace-browser.cjs
      - name: Build and review local desktop access UI
        run: |
          npm ci --prefix apps/desktop
          npm run build --prefix apps/desktop
          npm run dev --prefix apps/desktop > /tmp/sornio-desktop-server.log 2>&1 &
          desktop_pid=$!
          trap 'kill "$desktop_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:1420 > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node apps/desktop/check-ui.cjs
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node apps/desktop/check-checkout.cjs http://127.0.0.1:1420 "" /tmp/sornio-screenshots/checkout
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node apps/desktop/check-authorization.cjs
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node apps/desktop/check-customers.cjs
          NODE_PATH="$RUNNER_TEMP/sornio-browser/node_modules" node apps/desktop/check-retail.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Sornio-workspace-review
          path: |
            /tmp/sornio-screenshots/
            /tmp/sornio-server.log
            /tmp/sornio-desktop-server.log
          retention-days: 7

