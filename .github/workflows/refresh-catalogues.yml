name: Refresh localization catalogues
on:
  push:
    branches: ['fix/i18n-*', 'fix/enforce-owner-onboarding-20261023']
    paths:
      - .github/workflows/refresh-catalogues.yml
      - supabase/schema.sql
  workflow_dispatch:

  # Runs on review branches only. Never commit generated translations to main.

permissions:
  contents: write

concurrency:
  group: dukaan-localization-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    if: github.repository == 'uddieee33-blip/DukaanOS' && (startsWith(github.ref, 'refs/heads/fix/i18n-') || github.ref == 'refs/heads/fix/enforce-owner-onboarding-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Extract English source text
        run: npm run i18n:extract
      - name: Translate supported languages
        run: npm run i18n:generate
        env:
          I18N_BATCH_SIZE: '24'
          I18N_CONCURRENCY: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install low-resource translation dependencies
        run: |
          python -m pip install --disable-pip-version-check huggingface_hub onnxruntime sentencepiece transformers==4.57.6 protobuf numpy indictranstoolkit==1.1.1
          python -c 'from IndicTransToolkit import IndicProcessor; print("IndicTransToolkit is importable")'
      - name: Translate Bodo and Kashmiri
        run: npm run i18n:generate:low-resource
      - name: Require all language catalogues to pass
        run: npm run verify:i18n
      - name: Validate application before publishing changes
        run: |
          npm run lint
          npm run typecheck
          npm run typecheck:native
          npm run verify
          npm run build
      - name: Commit validated source and translations to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locales/en.json public/locales/
          if ! git diff --cached --quiet; then
            git commit -m "fix(i18n): regenerate and validate complete locale catalogues"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi
