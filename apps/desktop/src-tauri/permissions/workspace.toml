[[permission]]
identifier = "workspace-drafts"
description = "Set up/unlock local review access and operate bounded drafts through native authorization; no filesystem, SQL, shell or remote privileges."
commands.allow = ["workspace_access_status", "setup_local_access", "unlock_workspace", "lock_workspace", "load_workspace", "save_workspace", "list_workspace_copies", "restore_workspace"]

[[permission]]
identifier = "local-stock"
description = "Read and mutate bounded review stock through native authorization. No SQL, path, filesystem or network access."
commands.allow = ["list_local_products", "add_local_product", "adjust_local_stock"]


[[permission]]
identifier = "local-billing"
description = "Post bounded cash/credit invoices and read local records through native unlock. No network or outbox acknowledgement."
commands.allow = ["read_cashier_state", "prepare_local_checkout", "clear_local_checkout", "post_local_invoice", "list_local_invoices", "read_billing_outbox"]
