name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` is used rather than `npm install` so the build reproduces
      # package-lock.json exactly and fails loudly if the lockfile drifts from
      # package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Two type checks, on purpose. `typecheck` runs the JavaScript-API
      # compiler that typescript-eslint, the i18n extractor and Next's build
      # check all read; `typecheck:native` runs TypeScript 7's native compiler
      # (tsgo), which ships no JavaScript API and therefore cannot take that
      # slot yet. Running both means the tree is proven TS-7-clean today rather
      # than on the day typescript-eslint can consume the native API.
      # `scripts/compilers.mjs` carries the full explanation.
      - name: Type check
        run: npm run typecheck

      - name: Type check (native compiler)
        run: npm run typecheck:native

      # Includes `verify:i18n`, which first re-extracts every user-facing
      # phrase from the source tree and fails if locales/en.json no longer
      # matches it. Copy added to a screen without a catalogue regeneration
      # ships as English to all 22 scheduled languages; this is the step that
      # stops that reaching a shop counter.
      - name: Verify blueprints, theme, security and localisation
        run: npm run verify

      - name: Build
        run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Audited against the *production* dependency tree only.
      #
      # The dev tree currently reports five high-severity findings with a single
      # root cause: `braces@3.0.3` (GHSA-vfj7-8cjw-p6xm). The advisory's range
      # covers every version that exists, so there is nothing to upgrade to, and
      # the only remaining path to it is `eslint-config-next` ->
      # `@next/eslint-plugin-next` -> `fast-glob@3.3.1` -> `micromatch` ->
      # `braces`. `npm audit fix --force` "resolves" it by downgrading
      # eslint-config-next to 14.x, which would break this repo's flat config and
      # its typed lint rules; that is a regression wearing a fix's clothes.
      #
      # None of it ships: these are build-time glob matchers, and
      # `npm ls braces --omit=dev` prints an empty tree. Blocking CI on an
      # unfixable dev-only advisory would only train people to ignore it.
      #
      # Production dependencies must stay at zero — that is the tree that runs
      # against real business records.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
