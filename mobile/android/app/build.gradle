plugins { id 'com.android.application' }

android {
    namespace 'com.sornio.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sornio.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.review'; versionNameSuffix '-review' }
        release { minifyEnabled false }
    }
}
