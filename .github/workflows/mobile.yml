name: Mobile companion

on:
  pull_request:
    # Stacked draft PRs base on other `feature/` branches, so a `[main]`-only
    # filter never ran the companion checks for the Phase 12-18 stack.
    branches: [main, 'feature/*phase1*', 'feature/*lane*', 'repair/*', 'arena/*']
    paths:
      - 'apps/mobile/**'
      - 'packages/mobile-contracts/**'
      - 'packages/mobile-design/**'
      - 'scripts/verify-mobile-contracts.mjs'
      - 'apps/mobile/__runtime__/**'
      - 'apps/mobile/jest.config.js'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  shared:
    name: Contracts, types, security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Contract tests
        run: node scripts/verify-mobile-contracts.mjs
      - name: Simulator selection rules
        # Pure logic, so it runs on Linux and fails fast if the simulator matrix
        # would be unable to provision a device.
        run: node scripts/verify-simulator-choice.mjs
      - name: XCUITest target integration
        # The native suites can only compile on macOS; this proves the target
        # the plugin generates is valid pbxproj, compiles the committed sources,
        # is listed in the scheme and is safe to re-apply on every prebuild.
        run: node scripts/verify-uitest-target.mjs
      - name: Typecheck contracts
        working-directory: apps/mobile
        run: npx tsc --noEmit -p ../../packages/mobile-contracts/tsconfig.json
      - name: Typecheck companion
        working-directory: apps/mobile
        run: npx tsc --noEmit
      - name: Secret scan
        run: |
          set -euo pipefail
          PATTERN='service_role|SUPABASE_SERVICE_ROLE|BEGIN RSA PRIVATE KEY|AIza[0-9A-Za-z_-]{20,}'
          GREP=(grep -R -nE "$PATTERN" --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=android --exclude-dir=ios)
          CANARY=apps/mobile/.secret-scan-canary.ts
          trap 'rm -f "$CANARY"' EXIT
          printf '%s\n' "export const canary = 'SUPABASE_SERVICE_ROLE=synthetic-scan-canary-not-a-real-key';" > "$CANARY"
          if ! "${GREP[@]}" "$CANARY" >/dev/null; then
            echo 'Secret scanner failed to detect a synthetic service-role leak.'
            exit 1
          fi
          rm -f "$CANARY"
          if "${GREP[@]}" apps/mobile packages/mobile-contracts packages/mobile-design \
            | grep -v 'docs/' ; then
            echo 'Refusing secrets in the companion tree.'
            exit 1
          fi
          echo 'No service-role keys or private keys found in companion sources.'

  android:
    name: Android debug compile
    needs: shared
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Record APK identity
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          echo "commit=${GITHUB_SHA}"
          hash=$(sha256sum "$apk")
          echo "$hash"
          echo "::notice::Companion debug APK $hash"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          if [ -x "$aapt" ]; then
            badge=$("$aapt" dump badging "$apk" | head -5)
            echo "$badge"
            echo "::notice::$badge"
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Sornio-companion-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile
    needs: shared
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Xcode version
        run: xcodebuild -version
      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --non-interactive --no-install
      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install
      - name: Record Xcode and SDK versions
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list runtimes
          echo "::notice::xcode=$(xcodebuild -version | head -1) sdk=$(xcodebuild -showsdks | grep -i iphonesimulator | head -1)"

      - name: Simulator compile
        # `exit code 65` is xcodebuild's generic "build failed" and the raw log
        # lives in artefact storage that is not always retrievable, so the
        # errors are re-emitted as annotations here: the failing file and the
        # compiler message end up in the check record itself.
        shell: bash
        working-directory: apps/mobile/ios
        run: |
          set +e
          xcodebuild \
            -workspace Sornio.xcworkspace \
            -scheme Sornio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build > /tmp/ios-build.log 2>&1
          code=$?
          set -e
          tail -60 /tmp/ios-build.log || true
          if [ "$code" -ne 0 ]; then
            esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'; }
            { grep -E 'error:|\*\* BUILD FAILED \*\*|The following build commands failed' -A2 /tmp/ios-build.log \
              | head -80 | esc; } | sed 's/^/::error::iOS simulator build: /'
          fi
          exit "$code"

  runtime:
    name: Headless runtime acceptance
    # Runs on Linux by design: this executes the real component tree in Node and
    # needs no simulator. It is NOT a substitute for simulator acceptance — see
    # the `simulator` job below and docs/reviews/phase20-ios-ipados-product-completion.md.
    needs: shared
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci
      - name: iPhone, iPad and Android layout acceptance
        working-directory: apps/mobile
        run: npx jest --testTimeout=60000 --ci
      - name: Measured render benchmark
        working-directory: apps/mobile
        run: npx jest __runtime__/bench.test.tsx --testTimeout=300000 --ci
      - name: Record measured numbers
        run: |
          echo '::notice::Render measurements were printed by the benchmark step above. Compare them with docs/reviews/phase20-ios-ipados-product-completion.md.'

  simulator:
    name: ${{ matrix.label }} simulator acceptance
    # Compiling proves the project builds; this proves the app starts and can be
    # driven. Provisioning is delegated to scripts/select-ios-simulator.mjs, whose
    # selection rules are unit-tested on Linux by `npm run verify:simulator-choice`
    # so the choice itself no longer has to be debugged on a paid macOS runner.
    needs: ios
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPhone
            family: iPhone
            preferred: iPhone 16
          - label: iPad
            family: iPad
            preferred: iPad Pro 11-inch (M4)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Environment inventory
        # Printed before anything can fail, so a provisioning problem is
        # diagnosable from the log alone instead of from an exit code.
        run: |
          set +e
          echo "runner: $(uname -a)"
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version
          echo '--- runtimes ---'
          xcrun simctl list runtimes
          echo '--- device types (count) ---'
          xcrun simctl list devicetypes | wc -l
          echo '--- devices ---'
          xcrun simctl list devices available

      - name: Select and boot a ${{ matrix.label }} simulator
        id: boot
        run: node scripts/select-ios-simulator.mjs --family ${{ matrix.family }} --preferred "${{ matrix.preferred }}"

      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build for the booted simulator
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Sornio.xcworkspace \
            -scheme Sornio \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.boot.outputs.udid }}" \
            -derivedDataPath /tmp/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build

      - name: Install and verify the bundle identity
        run: |
          set -euo pipefail
          UDID="${{ steps.boot.outputs.udid }}"
          APP=$(find /tmp/dd/Build/Products -maxdepth 3 -name 'Sornio.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo '::error::No Sornio.app was produced by the build.'
            find /tmp/dd/Build/Products -maxdepth 3 -name '*.app' -type d || true
            exit 1
          fi
          echo "app bundle: $APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle identifier: $BID"
          if [ "$BID" != "com.sornio.companion" ]; then
            echo "::error::Unexpected bundle identifier '$BID'."
            exit 1
          fi
          xcrun simctl install "$UDID" "$APP"

      - name: Launch and assert the process survives
        id: launch
        run: |
          set -euo pipefail
          UDID="${{ steps.boot.outputs.udid }}"
          xcrun simctl launch "$UDID" com.sornio.companion | tee /tmp/launch.txt
          sleep 15
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q com.sornio.companion; then
            echo '::error::com.sornio.companion did not stay running.'
            echo '--- recent Sornio log ---'
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Sornio"' | tail -100 || true
            exit 1
          fi
          echo "::notice::com.sornio.companion is running on ${{ matrix.label }} simulator $UDID"

          # A live process can still be a broken app: a React render error leaves
          # the process running behind a red box. Fail on a fatal JS signature so
          # "launched" is not mistaken for "working".
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "Sornio"' > /tmp/sornio-launch.log 2>&1 || true
          if grep -qiE 'RCTFatal|Unhandled JS Exception|Invariant Violation|Application is not registered|No bundle URL present' /tmp/sornio-launch.log; then
            echo '::error::The application launched but reported a fatal JavaScript error.'
            grep -iE -A3 'RCTFatal|Unhandled JS Exception|Invariant Violation|Application is not registered|No bundle URL present' /tmp/sornio-launch.log | head -40
            exit 1
          fi
          echo 'No fatal JavaScript error signature in the launch log.'

          # Settle so the first screen is fully drawn before the screenshot.
          sleep 5

      - name: Screenshot of the running application
        if: always() && steps.boot.outputs.udid != ''
        run: |
          set -euo pipefail
          mkdir -p artifacts
          UDID="${{ steps.boot.outputs.udid }}"
          OUT="artifacts/${{ matrix.label }}-launch.png"
          xcrun simctl io "$UDID" screenshot "$OUT"
          # A screenshot that is not a real image is not evidence.
          SIZE=$(wc -c < "$OUT")
          echo "screenshot bytes: $SIZE"
          if [ "$SIZE" -lt 10000 ]; then
            echo '::error::Screenshot is implausibly small; treating it as not captured.'
            rm -f "$OUT"
            exit 1
          fi

      - name: Diagnostics
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          UDID="${{ steps.boot.outputs.udid }}"
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 10m --predicate 'process == "Sornio"' > artifacts/sornio-log.txt 2>&1
            xcrun simctl list devices > artifacts/simulators.txt 2>&1
            xcrun simctl list runtimes > artifacts/runtimes.txt 2>&1
            xcrun simctl io "$UDID" screenshot artifacts/final-state.png 2>/dev/null
          fi
          { echo "# ${{ matrix.label }} simulator job"; echo "udid=$UDID"; echo "runtime=${{ steps.boot.outputs.runtime }}"; } > artifacts/summary.md

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: simulator-${{ matrix.family }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  # Native interactive acceptance (§7 and §8 of Phase 20C).
  #
  # Deliberately separate from `simulator`: that job proves the app builds,
  # installs and survives on a booted device, and its evidence must not become
  # ambiguous. This job proves the interface can actually be operated, by tapping
  # real controls through XCUITest and asserting where each tap landed.
  ui-acceptance:
    name: ${{ matrix.label }} interactive acceptance
    needs: ios
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: iPhone
            family: iPhone
            preferred: iPhone 16
            suite: SornioIPhoneAcceptanceTests
          - label: iPad
            family: iPad
            preferred: iPad Pro 11-inch (M4)
            suite: SornioIPadAcceptanceTests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules
          key: ${{ runner.os }}-mobile-node-${{ hashFiles('apps/mobile/package-lock.json') }}

      - name: Environment inventory
        run: |
          set +e
          echo "runner: $(uname -a)"
          echo "commit: $GITHUB_SHA"
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Select and boot a ${{ matrix.label }} simulator
        id: boot
        run: node scripts/select-ios-simulator.mjs --family ${{ matrix.family }} --preferred "${{ matrix.preferred }}"

      - name: Install companion dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Prebuild iOS
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Verify the UI test target survived prebuild
        # prebuild regenerates ios/, so the config plugin has to have recreated
        # the target. Without this the suite would silently not exist.
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          echo '--- targets in the generated project ---'
          xcodebuild -list -project ios/Sornio.xcodeproj
          if ! xcodebuild -list -project ios/Sornio.xcodeproj | grep -q 'SornioUITests'; then
            echo '::error::SornioUITests is missing from the generated project; the config plugin did not run.'
            exit 1
          fi
          echo '--- generated test sources ---'
          ls -1 ios/SornioUITests/

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Run native interactive acceptance
        id: test
        working-directory: apps/mobile/ios
        # No `|| true`: a failing UI assertion must fail the job.
        #
        # Artifact and log downloads are not always reachable, but check-run
        # annotations are, so the failure reason is written there as well. The
        # extraction uses fixed-string greps: an earlier regex-based version
        # matched every line containing " TEST" and filled the 50-annotation
        # budget with environment dumps instead of the error.
        run: |
          set -o pipefail
          rm -rf /tmp/SornioResults.xcresult
          set +e
          xcodebuild test \
            -workspace Sornio.xcworkspace \
            -scheme Sornio \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.boot.outputs.udid }}" \
            -only-testing SornioUITests/${{ matrix.suite }} \
            -derivedDataPath /tmp/dd \
            -resultBundlePath /tmp/SornioResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            > /tmp/xcodebuild-test.log 2>&1
          STATUS=$?
          echo "xcodebuild exited $STATUS"
          tail -60 /tmp/xcodebuild-test.log
          if [ -d /tmp/SornioResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path /tmp/SornioResults.xcresult 2>/dev/null | head -40 || true
          fi
          if [ "$STATUS" -ne 0 ]; then
            {
              grep -F ': error:' /tmp/xcodebuild-test.log
              grep -F ' ** TEST' /tmp/xcodebuild-test.log
              grep -F 'Test Case' /tmp/xcodebuild-test.log | grep -F 'failed'
              grep -F 'Testing failed' /tmp/xcodebuild-test.log
              tail -12 /tmp/xcodebuild-test.log
            } 2>/dev/null \
              | sed 's/%/%25/g; s/\r//g' \
              | awk 'NF && !seen[$0]++' \
              | head -40 \
              | while IFS= read -r line; do
                  echo "::error title=native acceptance::$line"
                done
          fi
          exit "$STATUS"

      - name: Summarise the native results
        if: always()
        run: |
          set +e
          mkdir -p artifacts
          RESULT=/tmp/SornioResults.xcresult
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT" > artifacts/test-summary.json 2>/dev/null
            xcrun xcresulttool get test-results tests --path "$RESULT" > artifacts/test-tests.json 2>/dev/null
            cat artifacts/test-summary.json || true
            cp -R "$RESULT" artifacts/SornioResults.xcresult 2>/dev/null
          else
            echo 'No result bundle was produced.'
          fi
          # Screenshots the suites attached on failure and at each checkpoint.
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool export attachments --path "$RESULT" --output-path artifacts/attachments 2>/dev/null || true
          fi
          grep -cE 'Test Case .* passed' /tmp/xcodebuild-test.log 2>/dev/null > artifacts/passed-count.txt
          grep -cE 'Test Case .* failed' /tmp/xcodebuild-test.log 2>/dev/null > artifacts/failed-count.txt
          { echo "# ${{ matrix.label }} interactive acceptance"
            echo "commit: $GITHUB_SHA"
            echo "simulator: ${{ steps.boot.outputs.name }}"
            echo "runtime: ${{ steps.boot.outputs.runtime }}"
            echo "udid: ${{ steps.boot.outputs.udid }}"
            echo "suite: ${{ matrix.suite }}"
            echo "xcode: $(xcodebuild -version | head -1)"
            echo "passed: $(cat artifacts/passed-count.txt 2>/dev/null)"
            echo "failed: $(cat artifacts/failed-count.txt 2>/dev/null)"
          } > artifacts/summary.md
          cat artifacts/summary.md

      - name: Diagnostics
        if: always()
        run: |
          set +e
          UDID="${{ steps.boot.outputs.udid }}"
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 20m --predicate 'process == "Sornio"' > artifacts/sornio-log.txt 2>&1
            xcrun simctl io "$UDID" screenshot artifacts/final-state.png 2>/dev/null
          fi
          cp /tmp/xcodebuild-test.log artifacts/xcodebuild-test.log 2>/dev/null
          xcrun simctl list devices > artifacts/simulators.txt 2>&1

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Sornio-${{ matrix.family }}-UI-Acceptance
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
