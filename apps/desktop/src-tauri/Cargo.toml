[package]
name = "sornio-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
sornio-local-store = { path = "../../../packages/local-store" }
serde = { version = "1", features = ["derive"] }
fs2 = "0.4"
getrandom = "0.3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
