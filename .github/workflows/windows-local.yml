name: Windows local workspace
on:
  pull_request:
    # Include every base in the stacked draft-PR graph so PRs such as #134
    # (based on hardening/...) and #131 (based on integration/...) actually
    # trigger this acceptance workflow instead of silently never running.
    # Stacked Phase 13-18 draft PRs use another `feature/` branch as their base,
    # so a `[main]`-only filter meant they produced no Windows or browser result.
    branches: [main, 'integration/windows-finance-recovery', 'hardening/financial-recovery-audit-2026-10-31', 'test/windows-evidence-verification-2026-11-01', 'feature/windows-native-authorization', 'feature/windows-customer-credit', 'feature/*phase1*', 'feature/*lane*', 'repair/*', 'arena/*']
    paths: ['apps/desktop/**', 'packages/business-domain/**', 'packages/local-store/**', '.github/workflows/windows-local.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-windows:
    runs-on: windows-latest
    # The installed-application acceptance runs the whole installed-app
    # lifecycle, not just the first assertion. It previously finished early
    # because a stale assertion stopped it; with that repaired it needs the
    # time the rest of the job already takes.
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_THREADS: '4'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          workspaces: |
            packages/local-store
            apps/desktop/src-tauri
      - name: Select Strawberry Perl for vendored OpenSSL
        # Both locked Rust dependency trees use openssl-src 300.6.1, which
        # selects OPENSSL_SRC_PERL before PERL and PATH. A PowerShell PATH
        # lookup alone does not prove which Perl a later Bash step will run.
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl -PathType Leaf)) {
            throw "Required Strawberry Perl was not found: $perl"
          }
          & $perl -MIPC::Cmd -MLocale::Maketext::Simple -e 'print qq(Perl modules available\n)'
          if ($LASTEXITCODE -ne 0) { throw "Strawberry Perl module probe failed: $LASTEXITCODE" }
          & $perl -v
          if ($LASTEXITCODE -ne 0) { throw "Strawberry Perl version probe failed: $LASTEXITCODE" }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $perl) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify OpenSSL Perl in the Bash build environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'PATH resolves perl to: '; command -v perl || true
          printf 'openssl-src Perl: %s\n' "$OPENSSL_SRC_PERL"
          perl_unix="$(cygpath -u "$OPENSSL_SRC_PERL")"
          "$perl_unix" -MIPC::Cmd -MLocale::Maketext::Simple -e 'print "Perl modules available in build shell\n"'
      # Shared source files under lib/ and packages/ resolve packages from the
      # repo root. Installing only apps/desktop leaves those imports unable to
      # resolve react (TS2307 / TS2875), so the root install must run first.
      - name: Install shared root dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Type check the desktop app
        # `npm run build --prefix apps/desktop` is `tsc --noEmit && vite build`,
        # so a type error in the Tauri frontend only surfaced as "Build bundled
        # frontend failed" with the compiler's one-line diagnostic buried in a
        # log that expires. Split it out so the failing file and symbol are the
        # step name, and so a type error never reads as a bundler problem.
        working-directory: apps/desktop
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build bundled frontend
        working-directory: apps/desktop
        run: ./node_modules/.bin/vite build
      - name: Test encrypted storage, Windows vault and restart behavior
        # Emit each failing test as a workflow ::error:: annotation so the exact
        # failure is visible in the check record even when raw logs expire.
        # The step still fails with cargo's own exit code; nothing is skipped.
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          log="$(mktemp)"
          # Capture both pipeline statuses before another command can reset them.
          set +e
          cargo test --all-targets --release --locked --manifest-path packages/local-store/Cargo.toml --target-dir apps/desktop/src-tauri/target 2>&1 | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          code=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then
            echo "::error::Release test log write failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            if [ "$code" -eq 0 ]; then code=${statuses[1]}; fi
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Release native tests or logging failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.clean" || true
            esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'; }
            { grep -E '^test .* FAILED$|^test result: FAILED' "$log.clean" | head -60 | esc; } \
              | sed 's/^/::error::failing tests: /' || true
            { grep -E '^error(\[|:)' "$log.clean" | head -30 | esc; } \
              | sed 's/^/::error::compiler errors: /' || true
            { awk '/^failures:$/{f=1} f' "$log.clean" | grep -vE '^test .* ok$' | cut -c1-400 | head -120 | esc; } \
              | sed 's/^/::error::failure details: /' || true
            { tail -30 "$log.clean" | esc; } | sed 's/^/::error::log tail: /' || true
          fi
          exit "$code"
      - name: Test encrypted storage in the debug profile (overflow checks and debug assertions active)
        # Debug builds keep integer overflow checks and debug_assert! enabled;
        # the financial, inventory and recovery suites must pass there too, not
        # only in release. The step fails with cargo's own exit code; failing
        # tests are also emitted as ::error:: annotations like the release step.
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          log="$(mktemp)"
          set +e
          cargo test --all-targets --locked --manifest-path packages/local-store/Cargo.toml --target-dir apps/desktop/src-tauri/target 2>&1 | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          code=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then
            echo "::error::Debug test log write failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            if [ "$code" -eq 0 ]; then code=${statuses[1]}; fi
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Debug native tests or logging failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.clean" || true
            esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'; }
            { grep -E '^test .* FAILED$|^test result: FAILED' "$log.clean" | head -60 | esc; } \
              | sed 's/^/::error::failing debug-profile tests: /' || true
            { grep -E '^error(\[|:)' "$log.clean" | head -30 | esc; } \
              | sed 's/^/::error::compiler errors (debug): /' || true
            { awk '/^failures:$/{f=1} f' "$log.clean" | grep -vE '^test .* ok$' | cut -c1-400 | head -120 | esc; } \
              | sed 's/^/::error::debug failure details: /' || true
            { tail -30 "$log.clean" | esc; } | sed 's/^/::error::debug log tail: /' || true
          fi
          exit "$code"
      - name: Build independent Windows installer
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          log="$(mktemp)"
          set +e
          npm run desktop:build --prefix apps/desktop 2>&1 | tee "$log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          code=${statuses[0]}
          if [ "${statuses[1]}" -ne 0 ]; then
            echo "::error::Installer build log write failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            if [ "$code" -eq 0 ]; then code=${statuses[1]}; fi
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::Installer build or logging failed (command exit ${statuses[0]}, tee exit ${statuses[1]})."
            sed -e 's/\x1b\[[0-9;]*m//g' "$log" > "$log.clean" || true
            esc() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/$/%0A/' | tr -d '\n'; }
            { grep -E '^error(\[|:)|OpenSSL|perl |NSIS|failed to' "$log.clean" | head -40 | esc; } \
              | sed 's/^/::error::installer: /' || true
            { tail -50 "$log.clean" | esc; } | sed 's/^/::error::installer log tail: /' || true
          fi
          exit "$code"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install native accessibility review tooling
        run: python -m pip install pywinauto==0.6.9 Pillow==12.0.0
      - name: Test ciphertext preservation helper
        run: python -m unittest discover -s apps/desktop -p test_install_data.py
      - name: Test Windows artifact evidence contract
        run: python -m unittest discover -s apps/desktop -p test_windows_evidence.py
      - name: Build native synthetic scale fixture
        run: cargo build --release --locked --manifest-path packages/local-store/Cargo.toml --example cashier_review_bridge --target-dir apps/desktop/src-tauri/target
      - name: Verify native scale and damaged-return recovery
        run: python apps/desktop/check-native-scale.py --bridge apps/desktop/src-tauri/target/release/examples/cashier_review_bridge.exe --output dist/native-review/native-scale.json
      - name: Test native-check argument forwarding (no product install needed)
        # Pins the Invoke-NativeCheck contract: the fixture stage passes zero
        # extra arguments and the preserved-reopen stage passes exactly
        # '--verify-preserved'. Fails closed on a nonzero child exit.
        shell: pwsh
        run: pwsh -File apps/desktop/test-invoke-native-check.ps1
      - name: Verify installed offline app, recovery and lifecycle preservation
        shell: pwsh
        run: ./apps/desktop/check-installer.ps1
      - name: Verify native screenshots, installer checksum and lifecycle evidence
        run: python apps/desktop/check-windows-evidence.py --installer-dir apps/desktop/src-tauri/target/release/bundle/nsis --evidence-dir dist/native-review
      - name: Upload engineering installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sornio-Local-Workspace-Review
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            dist/native-review/installer-manifest.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload actual native screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sornio-Local-Native-Captures
          path: dist/native-review/
          if-no-files-found: ignore
          retention-days: 7

