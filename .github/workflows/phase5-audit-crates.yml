name: Phase 5 Audit Crate Fetch

on:
  push:
    branches: [arena/e831eb29-sornio]
    paths: ['.github/workflows/phase5-audit-crates.yml']

jobs:
  fetch-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch all locked crates
        run: |
          cargo fetch --locked --manifest-path packages/local-store/Cargo.toml
      - name: Pack and upload as release
        run: |
          tar cf crates.tar -C ~/.cargo/registry/cache/ crates/*/
          sha256sum crates.tar > crates.tar.sha256
          gh release create phase5-audit-crates --title "Phase 5 Audit Crates" --notes "Locked crate dependencies for independent audit" crates.tar crates.tar.sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
